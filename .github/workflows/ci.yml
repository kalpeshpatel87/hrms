name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Test-only values — never used outside CI.
  JWT_ACCESS_SECRET: ci_test_only_access_secret_do_not_use_in_prod_00000
  JWT_REFRESH_SECRET: ci_test_only_refresh_secret_do_not_use_in_prod_0000
  COOKIE_SECRET: ci_test_only_cookie_secret_do_not_use_in_prod_000000000
  CSRF_SECRET: ci_test_only_csrf_secret_do_not_use_in_prod_0000000000000
  DATABASE_URL: postgresql://atyantik:atyantik@localhost:5432/atyantik_ems_test?schema=public

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atyantik
          POSTGRES_PASSWORD: atyantik
          POSTGRES_DB: atyantik_ems_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atyantik"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Lint
        run: pnpm --filter api lint && pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter api typecheck && pnpm --filter web typecheck

      - name: Apply migrations
        run: pnpm --filter api prisma:deploy

      - name: Unit + integration tests
        run: pnpm --filter api test

      - name: Build
        run: pnpm --filter api build && pnpm --filter web build
        env:
          PUBLIC_API_URL: http://localhost:4000/api/v1

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t atyantik-ems-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t atyantik-ems-web:ci .
